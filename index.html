<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Captura A1101</title>
<style>
  :root { color-scheme: light dark; --gap: 12px; }
  * { box-sizing: border-box; }
  body { margin: 0 auto; padding: 16px; max-width: 640px; font: 16px/1.4 system-ui, sans-serif; }
  h1 { font-size: 1.2rem; margin: 0 0 8px; }
  #estado { min-height: 2.8em; margin: 0 0 var(--gap); padding: 8px 10px; border-radius: 8px;
            background: rgba(127,127,127,.15); }
  .visor { width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: 8px; overflow: hidden;
           display: flex; align-items: center; justify-content: center; margin-bottom: var(--gap); }
  .visor img { max-width: 100%; max-height: 100%; display: block; }
  .fila { display: flex; gap: var(--gap); margin-bottom: var(--gap); }
  .fila label { flex: 1; display: flex; flex-direction: column; font-size: .85rem; gap: 4px; }
  input { font: inherit; padding: 10px; border-radius: 8px; border: 1px solid rgba(127,127,127,.5);
          background: transparent; color: inherit; width: 100%; }
  button { font: inherit; min-height: 52px; padding: 0 16px; border-radius: 10px; border: 1px solid rgba(127,127,127,.5);
           background: rgba(127,127,127,.15); color: inherit; flex: 1; }
  button:disabled { opacity: .4; }
  #btnFoto { min-height: 72px; font-size: 1.2rem; font-weight: 600; background: #1a7f37; color: #fff; border-color: #1a7f37; }
  #btnFoto:disabled { background: rgba(127,127,127,.3); border-color: rgba(127,127,127,.3); }
  details { margin-top: var(--gap); }
  pre { white-space: pre-wrap; word-break: break-word; font-size: .75rem; max-height: 260px; overflow: auto;
        background: rgba(127,127,127,.12); padding: 8px; border-radius: 8px; }
</style>
</head>
<body>
<h1>Captura A1101 (prueba)</h1>
<div id="estado">Pulsa «Conectar cámara».</div>

<div class="visor"><img id="vista" alt="Vista en vivo"></div>

<div class="fila">
  <label>Nombre de cámara <input id="cam" value="CAM01" autocapitalize="characters"></label>
  <label>Etiqueta opcional <input id="etq" placeholder="ej. vid3" autocapitalize="none"></label>
</div>

<div class="fila"><button id="btnFoto" disabled>FOTO</button></div>
<div class="fila">
  <button id="btnConectar">Conectar cámara</button>
  <button id="btnDesconectar" disabled>Desconectar</button>
</div>

<details open>
  <summary>Registro (cópialo y mándamelo si algo falla)</summary>
  <pre id="log"></pre>
  <div class="fila">
    <button id="btnCopiar">Copiar registro</button>
    <button id="btnReiniciar" disabled>Reiniciar flujo</button>
  </div>
</details>

<script>
"use strict";
const VID = 0x2886, PIDS = [0x8060, 0x8061];        // Seeed SenseCAP A1101
const MAGIC_JPEG = 0x2B2D2B2D, MAGIC_TEXTO = 0x0F100E12;
const IFACE = 2, EP_IN = 2;                          // igual que agro_capture_v2.py

let disp = null, activo = false, ultimoJpeg = null, frames = 0, fotos = 0, ultimoDato = 0;
let urlVista = null, wake = null, textosLogueados = 0;
const usados = new Set();
const $ = id => document.getElementById(id);
const hex = n => "0x" + n.toString(16).padStart(4, "0");
const dormir = ms => new Promise(r => setTimeout(r, ms));

function log(m) {
  const t = new Date().toLocaleTimeString();
  const el = $("log");
  el.textContent += `[${t}] ${m}\n`;
  el.scrollTop = el.scrollHeight;
}
function estado(m) { $("estado").textContent = m; }
function botones() {
  $("btnConectar").disabled = activo;
  $("btnDesconectar").disabled = !activo;
  $("btnFoto").disabled = !activo || !ultimoJpeg;
  $("btnReiniciar").disabled = !activo;
}

function describir() {
  const c = disp.configuration;
  if (!c) { log("Sin configuración activa"); return; }
  log(`Configuración ${c.configurationValue}: ${c.interfaces.length} interfaces`);
  for (const i of c.interfaces) for (const a of i.alternates) {
    const eps = a.endpoints.map(e => `${e.endpointNumber}${e.direction === "in" ? "IN" : "OUT"}/${e.type}/${e.packetSize}`).join(" ");
    log(`  interfaz ${i.interfaceNumber} alt ${a.alternateSetting} clase 0x${a.interfaceClass.toString(16)} reclamada=${i.claimed}: ${eps}`);
  }
}

// Orden de variantes: la primera es la que usa el script de Python (lectura de control, clase, dispositivo).
async function control(valor) {
  const variantes = [
    ["IN/clase/dispositivo", () => disp.controlTransferIn({ requestType: "class", recipient: "device", request: 0x22, value: valor, index: 2 }, 2048)],
    ["OUT/clase/interfaz",   () => disp.controlTransferOut({ requestType: "class", recipient: "interface", request: 0x22, value: valor, index: 2 })],
    ["OUT/clase/dispositivo",() => disp.controlTransferOut({ requestType: "class", recipient: "device", request: 0x22, value: valor, index: 2 })],
    ["IN/clase/interfaz",    () => disp.controlTransferIn({ requestType: "class", recipient: "interface", request: 0x22, value: valor, index: 2 }, 2048)],
  ];
  for (const [nombre, f] of variantes) {
    try {
      const r = await f();
      log(`control 0x22 valor=${valor} correcto (${nombre}), estado=${r.status}`);
      return true;
    } catch (e) { log(`control 0x22 valor=${valor} falló (${nombre}): ${e.message}`); }
  }
  return false;
}

async function conectar() {
  if (!("usb" in navigator)) {
    estado("Este navegador no tiene WebUSB.");
    log(`WebUSB NO disponible. isSecureContext=${window.isSecureContext}. Hace falta Chrome y una dirección https://`);
    return;
  }
  try {
    const previos = (await navigator.usb.getDevices()).filter(d => d.vendorId === VID && PIDS.includes(d.productId));
    disp = previos.length ? previos[0] : await navigator.usb.requestDevice({ filters: PIDS.map(p => ({ vendorId: VID, productId: p })) });
  } catch (e) { log(`No se eligió dispositivo: ${e.message}`); estado("No se eligió ninguna cámara."); return; }

  log(`Dispositivo: ${hex(disp.vendorId)}:${hex(disp.productId)} ${disp.productName || ""} serie=${disp.serialNumber || "-"}`);
  try {
    await disp.open();
    log("open() correcto");
    if (disp.configuration === null) { await disp.selectConfiguration(1); log("selectConfiguration(1) correcto"); }
    describir();
    await disp.claimInterface(IFACE);
    log(`claimInterface(${IFACE}) correcto`);
    try { await disp.selectAlternateInterface(IFACE, 0); log("selectAlternateInterface(2,0) correcto"); }
    catch (e) { log(`selectAlternateInterface falló (se sigue): ${e.message}`); }
    if (!(await control(1))) { estado("La cámara no aceptó la orden de inicio. Mira el registro."); await cerrar(); return; }
  } catch (e) {
    log(`ERROR al conectar: ${e.name}: ${e.message}`);
    estado("No se pudo conectar. Mira el registro.");
    await cerrar();
    return;
  }
  activo = true; frames = 0; ultimoDato = Date.now(); textosLogueados = 0;
  try { wake = await navigator.wakeLock.request("screen"); } catch (_) {}
  estado("Conectada. Esperando imagen…");
  botones();
  leer();
}

async function leer() {
  let chunks = [], total = 0, esperado = 0, tipo = null;
  let nLect = 0, bytesTot = 0, t0 = Date.now();
  log("leer(): empieza a leer del endpoint 2 (transferIn 2048)");
  const dj = setInterval(() => { if (activo) log(`[diag] ${Math.round((Date.now() - t0) / 1000)} s · lecturas completadas=${nLect} · bytes=${bytesTot}${nLect === 0 ? " · transferIn sigue pendiente (sin datos)" : ""}`); else clearInterval(dj); }, 3000);
  while (activo) {
    let r;
    try { r = await disp.transferIn(EP_IN, 2048); nLect++; if (r.data) bytesTot += r.data.byteLength;
      if (nLect <= 6) { const b = r.data ? Array.from(new Uint8Array(r.data.buffer, r.data.byteOffset, Math.min(16, r.data.byteLength))).map(x => x.toString(16).padStart(2, "0")).join(" ") : ""; log(`[diag] lectura ${nLect}: estado=${r.status} bytes=${r.data ? r.data.byteLength : 0} ${b}`); } }
    catch (e) { if (activo) { log(`transferIn falló: ${e.name}: ${e.message}`); estado("Se perdió la conexión con la cámara."); } break; }
    if (r.status === "stall") { try { await disp.clearHalt("in", EP_IN); } catch (_) {} continue; }
    if (r.status !== "ok" || !r.data || r.data.byteLength === 0) continue;
    ultimoDato = Date.now();
    const d = new Uint8Array(r.data.buffer, r.data.byteOffset, r.data.byteLength);

    if (d.length === 8) {
      const dv = new DataView(d.buffer, d.byteOffset, 8);
      const magic = dv.getUint32(0, false);
      if (magic === MAGIC_JPEG || magic === MAGIC_TEXTO) {
        tipo = magic === MAGIC_JPEG ? "jpeg" : "texto";
        esperado = dv.getUint32(4, false);
        chunks = []; total = 0;
        continue;
      }
    }
    chunks.push(d.slice()); total += d.length;
    if (esperado && total > esperado) { log(`Trama descartada: llegaron ${total} bytes y se esperaban ${esperado}`); chunks = []; total = 0; esperado = 0; continue; }
    if (esperado && total === esperado) {
      const datos = new Uint8Array(total);
      let o = 0; for (const c of chunks) { datos.set(c, o); o += c.length; }
      chunks = []; total = 0; esperado = 0;
      if (tipo === "jpeg") {
        if (datos[0] === 0xFF && datos[1] === 0xD8) nuevaImagen(datos);
        else log("Trama JPEG descartada: no empieza por FFD8");
      } else if (textosLogueados < 3) {
        textosLogueados++;
        log("Trama de texto: " + new TextDecoder().decode(datos).slice(0, 200));
      }
    }
  }
  if (activo) { activo = false; botones(); }
}

function nuevaImagen(bytes) {
  ultimoJpeg = new Blob([bytes], { type: "image/jpeg" });
  frames++;
  const url = URL.createObjectURL(ultimoJpeg);
  const img = $("vista");
  img.onload = () => { if (urlVista) URL.revokeObjectURL(urlVista); urlVista = url; };
  img.src = url;
  if (frames === 1) { log(`Primera imagen recibida (${bytes.length} bytes)`); botones(); }
  estado(`Conectada · imágenes recibidas: ${frames} · fotos guardadas: ${fotos}`);
}

function marca(f) {
  const p = (n, l = 2) => String(n).padStart(l, "0");
  return `${f.getFullYear()}${p(f.getMonth() + 1)}${p(f.getDate())}_${p(f.getHours())}${p(f.getMinutes())}${p(f.getSeconds())}`;
}

function foto() {
  if (!ultimoJpeg) { estado("Todavía no ha llegado ninguna imagen."); return; }
  const cam = ($("cam").value.trim() || "CAM01").replace(/[^\w\-]+/g, "_");
  const etq = $("etq").value.trim().replace(/[^\w\-]+/g, "_");
  const base = `${etq ? etq + "_" : ""}${cam}_${marca(new Date())}`;
  let nombre = base, n = 0;
  while (usados.has(nombre)) nombre = `${base}_${++n}`;     // misma convención que agro_capture: sufijo _1, _2…
  usados.add(nombre);
  const url = URL.createObjectURL(ultimoJpeg);
  const a = document.createElement("a");
  a.href = url; a.download = nombre + ".jpg";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
  fotos++;
  log(`Foto: ${nombre}.jpg (${ultimoJpeg.size} bytes)`);
  estado(`Guardada: ${nombre}.jpg · fotos guardadas: ${fotos}`);
}

async function cerrar() {
  try { await disp.releaseInterface(IFACE); } catch (_) {}
  try { await disp.close(); } catch (_) {}
}
async function desconectar() {
  activo = false;
  await cerrar();
  try { if (wake) await wake.release(); } catch (_) {}
  log("Desconectada");
  estado("Desconectada.");
  botones();
}
async function reiniciar() {
  if (!activo) return;
  log("Reiniciando flujo: orden de parada y de inicio");
  await control(0);
  await dormir(500);
  await control(1);
}

$("btnConectar").onclick = conectar;
$("btnDesconectar").onclick = desconectar;
$("btnFoto").onclick = foto;
$("btnReiniciar").onclick = reiniciar;
$("btnCopiar").onclick = async () => {
  try { await navigator.clipboard.writeText($("log").textContent); estado("Registro copiado."); }
  catch (_) { const r = document.createRange(); r.selectNodeContents($("log")); getSelection().removeAllRanges(); getSelection().addRange(r); estado("Selecciona y copia el registro a mano."); }
};

if ("usb" in navigator) {
  navigator.usb.addEventListener("disconnect", e => {
    if (disp && e.device === disp) { log("La cámara se ha desconectado (evento USB)"); activo = false; botones(); estado("Cámara desconectada."); }
  });
}
setInterval(() => {
  if (!activo) return;
  const s = Math.round((Date.now() - ultimoDato) / 1000);
  if (s >= 5) estado(`Sin datos desde hace ${s} s. Prueba «Reiniciar flujo».`);
}, 1000);

log(`Página cargada. isSecureContext=${window.isSecureContext}, WebUSB=${"usb" in navigator}`);
log(`Navegador: ${navigator.userAgent}`);
</script>
</body>
</html>
